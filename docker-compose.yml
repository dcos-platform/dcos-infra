version: "3.9"

# ---------------------------------------------------------------------------
# DCOS Shared Infrastructure
#
# Services:
#   rabbitmq  – message broker used by all DCOS microservices
#   postgres  – shared relational database
#   adminer   – lightweight web UI for PostgreSQL
#
# Usage:
#   cp .env.example .env   # edit values as needed
#   docker-compose up -d
# ---------------------------------------------------------------------------

networks:
  dcos-net:
    name: dcos-net
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:

services:

  # -------------------------------------------------------------------------
  # RabbitMQ – AMQP message broker
  # -------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: dcos-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-dcos}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-changeme}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - dcos-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # -------------------------------------------------------------------------
  # PostgreSQL – shared relational database
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: dcos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dcos}
      POSTGRES_USER: ${POSTGRES_USER:-dcos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - dcos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dcos} -d ${POSTGRES_DB:-dcos}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # -------------------------------------------------------------------------
  # Adminer – web-based database management UI
  # Accessible at http://localhost:<ADMINER_PORT>
  # -------------------------------------------------------------------------
  adminer:
    image: adminer:4-standalone
    container_name: dcos-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    networks:
      - dcos-net
    depends_on:
      postgres:
        condition: service_healthy
